AWSTemplateFormatVersion: "2010-09-09"
Description: DynamoDB Users table for Quant Screener India authentication

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: quant-screener-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      Tags:
        - Key: Project
          Value: quant-screener-india
        - Key: Purpose
          Value: user-authentication

Outputs:
  UsersTableName:
    Description: Name of the DynamoDB Users table
    Value: !Ref UsersTable
  UsersTableArn:
    Description: ARN of the DynamoDB Users table
    Value: !GetAtt UsersTable.Arn
