AWSTemplateFormatVersion: '2010-09-09'
Description: DynamoDB cache table with TTL for Quant Screener India

Resources:
  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: quant-screener-cache
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cache_key
          AttributeType: S
      KeySchema:
        - AttributeName: cache_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: quant-screener-india

Outputs:
  CacheTableName:
    Value: !Ref CacheTable
  CacheTableArn:
    Value: !GetAtt CacheTable.Arn
